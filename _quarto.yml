      - text: "4: Data Visualization"
        href: 4_ggplot.qmd
    right:
      - text: "To learn more"
        menu:
        - text: Bonus material
          href: bonus.qmd
        - text: "------------------"
        - text: OSU Code Club {{< fa external-link >}}
          href: https://osu-codeclub.github.io
