          href: https://r4ds.hadley.nz
          target: _blank
      - text: About
        href: about.qmd
    tools:
      - icon: github
        menu:
          - text: Source Code
            url:  https://github.com/osu-codeclub/carpentries-aug-2026
            target: _blank
          - text: Report an Issue
            url:  https://github.com/osu-codeclub/carpentries-aug-2026/issues/new?template=Blank+issue
            target: _blank

format:
  html:
    theme: yeti
    syntax-highlighting: atom-one
    css:
      - styles.css
      - include/webex.css
    include-after-body: include/webex.js
    toc: true
    number-sections: true
    number-depth: 3
    grid:
      body-width: 800px

execute:
  freeze: auto

knitr:
  opts_chunk:
    class-output: regular-r-output
    class-message: regular-r-output
    class-warning: warning-r-output
    class-error: error-r-output
